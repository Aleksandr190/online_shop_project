version: '3.8'

services:
  backend:
    volumes:
      - django_static:/app/backend_static
      - django_media:/app/backend_media
    command: gunicorn core.wsgi:application --bind 0.0.0.0:8000 --workers 3
    ports: []

  frontend:
    build:
      context: ./frontend_project
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"
    volumes:
      - django_static:/app/backend_static
      - django_media:/app/backend_media