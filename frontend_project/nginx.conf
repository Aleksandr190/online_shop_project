server {
    listen 80;
    server_name 130.49.128.168;

    # 1. Раздача React фронтенда
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. Прокси для Django API
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Прокси для Django админки
    location /admin/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Раздача статики Django (стили админки)
    location /static/django/ {
        alias /app/backend_static/;
    }

    # 5. Раздача медиафайлов Django (картинки)
    location /media/ {
        alias /app/backend_media/;
    }
}