version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - pg_catalog_data:/var/lib/postgresql/data
    env_file:
      - .env   
    ports:
      - "5432:5432"

  backend:
    build: ./backend_project
    volumes:
      - ./backend_project:/app
    ports:
      - "8000:8000"
    env_file:
    - .env
    depends_on:
      - db

  frontend:
    depends_on:
      - backend

volumes:
  pg_catalog_data:
  django_static:
  django_media: